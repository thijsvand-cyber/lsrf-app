<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LSRF — Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2a0a19}
a{color:#043241}a:hover{color:#021d26}
.ph{background:repeating-linear-gradient(135deg,#0A3E50 0 14px,#06384A 14px 28px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{pink}}; color: #043241; font-family: Archivo, system-ui, sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto; padding: 52px 16px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; justify-content: space-between; align-items: flex-end">
<h1 style="margin: 0; font-weight: 900; font-stretch: 62.5%; font-size: 64px; line-height: 0.9; text-transform: uppercase">Shop</h1>
<button aria-label="Cart, {{cartCount}} items" style="position: relative; width: 48px; height: 48px; border-radius: 24px; border: none; background: #043241; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: -2px; right: -2px; min-width: 22px; height: 22px; border-radius: 11px; background: #D32236; color: #FFFFFF; font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{cartCount}}</span></button>
</header>

<div style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Made in the EU · Free EU shipping over €100 · 30-day returns</div>

<div role="tablist" aria-label="Categories" style="flex-shrink: 0; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<a href="Team.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px; background: #043241; color: #FFFFFF; border-radius: 4px; text-decoration: none">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: {{pink}}">TEAMWEAR</span>
<span style="font-weight: 900; font-stretch: 62.5%; font-size: 32px; line-height: 0.95; text-transform: uppercase; color: #EEFF07">Ride like Team Bomba Join</span>
</div>
<span aria-hidden="true" style="font-size: 22px; font-weight: 900">→</span>
</a>

<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 4px; overflow: hidden">
<div class="ph" style="aspect-ratio: 4 / 5; position: relative"><span style="position: absolute; left: 10px; top: 8px; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; color: #9FC3CF">[PRODUCT PHOTO]</span></div>
<div style="padding: 10px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #D32236">{{p.kind}}</div>
<div style="font-weight: 900; font-stretch: 62.5%; font-size: 22px; line-height: 1; text-transform: uppercase">[Product name]</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 700">[€ price]</span>
<button aria-label="Add to cart" onClick="{{add}}" style="width: 36px; height: 36px; border: none; border-radius: 18px; background: #043241; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
</div>
</sc-for>
</section>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #043241; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Home</a>
<a href="Podcasts.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg>Listen</a>
<a href="KlakAf.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Klak Af!</a>
<a href="Team.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6 6 0 0 1 3.5 6"></path></svg>Team</a>
<a href="Shop.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #EEFF07"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Shop</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pink":{"editor":"color","default":"#F062F9","options":["#F062F9","#BC54C8","#EEFF07"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'onbike', cart: 0 };
}
renderVals() {
const pink = this.props.pink ?? '#F062F9';
const cat = this.state.cat;
const defs = [['onbike', 'On bike'], ['casual', 'BOMBA Casual'], ['team', 'Teamwear'], ['gifts', 'Gifts'], ['outlet', 'Outlet']];
const cats = defs.map(([id, label]) => {
const on = cat === id;
return {
label, sel: on ? 'true' : 'false',
pick: () => this.setState({ cat: id }),
style: 'flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 20px; cursor: pointer; font-family: Chakra Petch, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; white-space: nowrap; ' + (on ? 'border: none; background: #043241; color: #EEFF07' : 'border: 2px solid #043241; background: transparent; color: #043241')
};
});
const kinds = {
onbike: ['JERSEY', 'BIB SHORTS', 'GILET', 'ESSENTIALS'],
casual: ['LONGSLEEVE', 'CREWNECK', 'T-SHIRT', 'T-SHIRT'],
team: ['TEAM JERSEY', 'TEAM BIBS', 'TEAM JACKET', 'TEAM CAP'],
gifts: ['GIFT', 'GIFT', 'GIFT CARD', 'GIFT'],
outlet: ['WAREHOUSE SALE', 'WAREHOUSE SALE', 'WAREHOUSE SALE', 'WAREHOUSE SALE']
};
const products = kinds[cat].map((kind) => ({ kind }));
return {
pink, cats, products,
cartCount: this.state.cart,
add: () => this.setState({ cart: this.state.cart + 1 })
};
}
}
</script>
</body>
</html>
