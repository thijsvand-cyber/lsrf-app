<x-dc>
<helmet>

<p style="margin: 0; font-size: 14px; line-height: 1.4; color: #C9DCE2">KLAK AF! Live Slow Ride Fast Community</p>

<div style="display: flex; justify-content: space-between; gap: 8px"><span style="{{c.nameStyle}}">{{c.name}}</span><span style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 600; color: #A9C4CD; flex-shrink: 0">{{c.time}}</span></div>
<div style="font-size: 13px; color: #A9C4CD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</div>
</div>
<sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{ true }}">
<span style="min-width: 26px; height: 26px; border-radius: 13px; background: {{pink}}; color: #043241; font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 7px; box-sizing: border-box">{{c.unread}}</span>

</sc-for>
</section>

<section style="display: flex; flex-direction: column">

</div>

</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #021F29; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">

<a href="KlakAf.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #EEFF07"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Klak Af!</a>
<a href="Team.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6 6 0 0 1 3.5 6"></path></svg>Team</a>
<a href="Shop.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Shop</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pink":{"editor":"color","default":"#F062F9","options":["#F062F9","#BC54C8","#EEFF07"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pink = this.props.pink ?? '#F062F9';
const list = [
{ name: 'Boulevard', tag: 'BLVD', last: '[Rider]: [Latest message]', time: '20:15', unread: 6 },
{ name: 'Marktplaats', tag: 'MRKT', last: '[Rider] is deelnemer geworden', time: '20:11', unread: 0 },
{ name: 'Ride Fast Coppi', tag: 'RF', last: '[Rider]: [Latest message]', time: '19:54', unread: 3 },
{ name: 'Koers Coppi', tag: 'KRS', last: '[Rider]: [Latest message]', time: '19:16', unread: 0 },
{ name: 'Live Slow Bartali', tag: 'LS', last: '[Rider] is deelnemer geworden', time: '17:19', unread: 0 },
{ name: 'Podcast Bartali', tag: 'POD', last: '[Rider] is deelnemer geworden', time: '17:18', unread: 0 },
{ name: 'Cross', tag: 'CX', last: "[Rider]: Who's driving to Zeddam Sunday?", time: 'Gisteren', unread: 12 }
];
const channels = list.map((c) => {
const u = c.unread > 0;
return {
name: c.name, tag: c.tag, time: c.time, last: c.last, unread: c.unread, hasUnread: u,
iconStyle: 'width: 40px; height: 40px; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: Chakra Petch, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.02em; ' + (u ? 'background: ' + pink + '; color: #043241' : 'background: #0B4053; color: #C9DCE2'),
nameStyle: 'font-size: 16px; ' + (u ? 'font-weight: 900' : 'font-weight: 600; color: #DCE8EC')
};
});
return { pink, channels };
}
}
</script>
</body>
</html>
