<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LSRF — Podcasts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2a0a19}
a{color:#043241}a:hover{color:#021d26}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{pink}}; color: #043241; font-family: Archivo, system-ui, sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 156px; overflow-y: auto; padding: 52px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

<h1 style="margin: 0; font-weight: 900; font-stretch: 62.5%; font-size: 64px; line-height: 0.9; text-transform: uppercase">Listen</h1>

<div role="tablist" aria-label="Shows" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #043241; border-radius: 4px">
<button role="tab" aria-selected="{{lsrfSel}}" onClick="{{pickLsrf}}" style="{{lsrfTabStyle}}">LSRF Podcast</button>
<button role="tab" aria-selected="{{bwSel}}" onClick="{{pickBw}}" style="{{bwTabStyle}}">Beter Worden</button>
</div>

<section style="display: flex; gap: 14px; align-items: flex-end">
<div style="{{coverStyle}}">{{coverLine1}}<br>{{coverLine2}}</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">{{tagline}}</div>
<p style="margin: 0; font-size: 14px; line-height: 1.4">{{blurb}}</p>
<button style="align-self: flex-start; margin-top: 4px; height: 40px; padding: 0 16px; border-radius: 2px; border: none; background: #D32236; color: #FFFFFF; font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">+ Follow</button>
</div>
</section>

<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 2px; font-weight: 900; font-stretch: 62.5%; font-size: 30px; text-transform: uppercase">Episodes</h2>
<sc-for list="{{episodes}}" as="ep" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 2px solid #043241">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 600">{{ep.meta}}</div>
<div style="font-size: 16px; font-weight: 800; line-height: 1.25">{{ep.title}}</div>
</div>
<button aria-label="{{ep.label}}" onClick="{{ep.play}}" style="{{ep.btnStyle}}"><sc-if value="{{ep.isPlaying}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if><sc-if value="{{ep.notPlaying}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></sc-if></button>
</div>
</sc-for>
</section>
</div>

<div style="position: absolute; left: 10px; right: 10px; bottom: 92px; height: 60px; border-radius: 4px; background: #043241; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 6px 0 10px; box-sizing: border-box">
<div style="{{miniCoverStyle}}"></div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{nowTitle}}</div>
<div style="height: 3px; background: #1E5266"><div style="width: 38%; height: 3px; background: #EEFF07"></div></div>
</div>
<button aria-label="{{miniLabel}}" onClick="{{toggle}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #EEFF07; display: flex; align-items: center; justify-content: center; cursor: pointer"><sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if><sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></sc-if></button>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #043241; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box; border-top: 1px solid #0F4A5E">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Home</a>
<a href="Podcasts.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #EEFF07"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg>Listen</a>
<a href="KlakAf.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Klak Af!</a>
<a href="Team.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6 6 0 0 1 3.5 6"></path></svg>Team</a>
<a href="Shop.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; min-height: 48px; justify-content: center; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #C9DCE2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Shop</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pink":{"editor":"color","default":"#F062F9","options":["#F062F9","#BC54C8","#EEFF07"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { show: 'lsrf', playingId: null, lastId: 'lsrf-1' };
}
renderVals() {
const pink = this.props.pink ?? '#F062F9';
const show = this.state.show;
const isL = show === 'lsrf';
const tab = (on) => 'height: 44px; border-radius: 2px; border: none; font-family: Chakra Petch, sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; ' + (on ? 'background: #EEFF07; color: #043241' : 'background: transparent; color: #FFFFFF');
const shows = {
lsrf: { name: 'LSRF Podcast', l1: 'LSRF', l2: 'Podcast', bg: '#043241', fg: pink, tagline: 'LIVE SLOW RIDE FAST', blurb: '[One-line description of the LSRF Podcast]' },
bw: { name: 'Beter Worden', l1: 'Beter', l2: 'Worden', bg: '#EEFF07', fg: '#043241', tagline: 'BETER WORDEN', blurb: '[One-line description of Beter Worden]' }
};
const s = shows[show];
const playingId = this.state.playingId;
const episodes = [1, 2, 3, 4, 5].map((n) => {
const id = show + '-' + n;
const on = playingId === id;
return {
title: '[Episode title]',
meta: 'EP [##] · [DD/MM] · [MM] MIN',
isPlaying: on, notPlaying: !on,
label: on ? 'Pause episode' : 'Play episode',
btnStyle: 'width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; ' + (on ? 'background: #D32236; color: #FFFFFF' : 'background: #043241; color: #FFFFFF'),
play: () => this.setState({ playingId: on ? null : id, lastId: id })
};
});
const lastShow = this.state.lastId.startsWith('lsrf') ? shows.lsrf : shows.bw;
const playing = playingId !== null;
return {
pink,
lsrfSel: isL ? 'true' : 'false', bwSel: isL ? 'false' : 'true',
lsrfTabStyle: tab(isL), bwTabStyle: tab(!isL),
pickLsrf: () => this.setState({ show: 'lsrf' }),
pickBw: () => this.setState({ show: 'bw' }),
coverStyle: 'width: 140px; height: 140px; flex-shrink: 0; border-radius: 2px; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 125%; font-size: 20px; line-height: 0.95; text-transform: uppercase; background: ' + s.bg + '; color: ' + s.fg,
coverLine1: s.l1, coverLine2: s.l2, tagline: s.tagline, blurb: s.blurb,
episodes,
miniCoverStyle: 'width: 40px; height: 40px; border-radius: 2px; flex-shrink: 0; background: ' + (lastShow.bg === '#043241' ? pink : lastShow.bg),
nowTitle: lastShow.name + ' · [Episode title]',
playing, paused: !playing,
miniLabel: playing ? 'Pause' : 'Play',
toggle: () => this.setState({ playingId: playing ? null : this.state.lastId })
};
}
}
</script>
</body>
</html>
